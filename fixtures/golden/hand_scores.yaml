# The hand-score template for the golden set (fixtures/golden/jobs.json).
#
# This is the reference WERA's scoring tier is measured against. `uv run wera eval` scores every
# ad with a model and reports two numbers:
#
#   * **Agreement** — the share of scored ads whose computed fit total lands within ±1.5 of the
#     `total` below. SPEC §12.2 wants ≥80% before a model is trusted.
#   * **Keyword recall** — the share of the `keywords` below that `keywords.extract` found.
#
# ## How to fill this in
#
# Read each ad in fixtures/golden/jobs.json against fixtures/demo/cv.json (Jordan Ellery, CS
# graduate 2026, London) and put a number 0–10 in `total`. Score the *fit*, the same thing
# SPEC §8.2 computes: how well this person matches this job, not how much they'd enjoy it.
#
#   9–10  you would apply today; the ad reads as though it were written for this CV
#   7–8   a good match worth an application, with one or two gaps
#   5–6   plausible, but the CV is a stretch or the role is adjacent
#   3–4   wrong seniority, wrong location, or the overlap is incidental
#   0–2   a different job in a different field
#
# An ad with no description (gold-16, gold-17) is **rough-only**: SPEC §8.2 caps its computed
# total at 6.5, because a title match is not a fit. Score what the title alone justifies and
# remember the cap — a hand score above 6.5 there can never be agreed with.
#
# `total: ~` means not yet scored. The eval skips those for agreement and says how many it
# skipped, so a half-filled file still produces a usable report.
#
# `keywords` is pre-filled with the terms each ad names explicitly — a starting point, not a
# judgement. Edit it: take out anything you would not expect a scorer to pick up, and add
# anything the ad clearly asks for in other words. Only terms listed here count towards recall.
#
# Re-score this file whenever fixtures/demo/cv.json changes. A hand score is a judgement about
# one CV against one ad; change the CV and the number stops meaning anything.

scores:
  # 01 · AI Platform Engineer, Graduate — Aurelis Labs · London, hybrid · graduate
  #      Python/FastAPI guardrails, Presidio, LangGraph, PostgreSQL, visa sponsorship.
  gold-01-aurelis-ai-platform:
