[project]
name = "wera-agent"
version = "0.1.0"
description = "WERA agent service: data, scoring, LangGraph gates and intake behind the web app."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.143.2",
  "logfire[fastapi]==5.2.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "pyyaml==6.0.3",
  "sqlalchemy==2.1.4",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]

[project.scripts]
wera = "wera_agent.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-socket==0.8.1",
  "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wera_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DEMO-02: tests never touch the network. Loopback stays open for the in-process ASGI client.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
