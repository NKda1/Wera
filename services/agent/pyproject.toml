[project]
name = "wera-agent"
version = "0.1.0"
description = "WERA agent service: data, scoring, LangGraph gates and intake behind the web app."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "apscheduler==3.11.3",
  "dkimpy==1.1.8",
  "fastapi==0.143.2",
  "fastembed==0.9.0",
  "firecrawl-py==4.50.0",
  "httpx==0.28.1",
  "imapclient==4.1.0",
  "langchain-core==1.6.11",
  "langchain-openai==1.7.2",
  "langgraph==1.2.15",
  "langgraph-checkpoint-postgres==3.2.0",
  "logfire[fastapi]==5.2.0",
  "numpy==2.5.4",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "pyyaml==6.0.3",
  "rapidfuzz==3.14.6",
  "redis==8.1.0",
  "selectolax==1.0.1",
  "sqlalchemy==2.1.4",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
# SRCH-05's browser rung. An extra, not a default, because the Python package is only half of it:
# the Chromium it drives is a separate ~150 MB download (`playwright install chromium`), and
# making every clone pay for that would be a poor trade for a rung the ladder can skip.
#
# Without it, `sources.extract` still reads JSON-LD and ATS feeds over plain HTTP and still falls
# back to the fast tier — so a default install is already far cheaper than the Firecrawl scrape it
# replaces. With it, the JavaScript-rendered boards work too. `sources.browser` treats the whole
# thing as optional and returns "couldn't render" when it isn't there.
browser = ["playwright==1.57.0"]

[project.scripts]
wera = "wera_agent.cli:main"

[dependency-groups]
dev = [
  "fakeredis==2.40.0",
  # SQLite is the unit tests' database and nothing else's (REL-04). The SQLite checkpointer goes
  # with it — and `wera db import-sqlite` reads an old install's gate threads through it.
  "langgraph-checkpoint-sqlite==3.1.2",
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-socket==0.8.1",
  "respx==0.23.1",
  "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wera_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# DEMO-02: tests never touch the network. Loopback stays open for the in-process ASGI client.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost"

[tool.logfire]
# Tests and one-off scripts don't configure logfire; the warning adds nothing.
ignore_no_config = true

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
