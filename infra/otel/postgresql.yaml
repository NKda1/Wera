# Postgres server metrics into Logfire (OBS-04), through the OpenTelemetry Collector's
# `postgresql` receiver. Run it with `scripts/otel-collector.sh`, which loads the variables below
# from .env.local and the write token from .logfire/ — none of them are in this file.
#
# What it reads is the server's own statistics (pg_stat_*), as the `logfire_monitor` role, which
# holds `pg_monitor` and nothing else: no table in any database is readable by it.
#
# **Sized for Logfire's bill.** Logfire counts each metric data point as a record, against the
# same 10M a month as WERA's spans (then $2 a million; the Personal plan stops ingesting at the
# cap). Logfire's template — every database, every 10 s, per-table and per-index series on — sent
# 32,757 points in its first six minutes here, about 7.8M a day: the month's allowance in under
# two days, after which WERA's own traces would stop arriving. So, changed from the template:
#
# * `databases: [wera]`, not every database (test, demo and other projects' databases too).
# * `collection_interval: 60s`, not 10s.
# * The per-table and per-index series off. Each is one series per table or index, several per
#   table for `blocks_read` and `operations`; together they were most of the volume. Sizes and
#   scan counts per table are one query away in Postgres itself whenever they're wanted:
#     select relname, pg_size_pretty(pg_total_relation_size(relid)), seq_scan, idx_scan
#     from pg_stat_user_tables order by pg_total_relation_size(relid) desc;
# * `tls.insecure` (this server has ssl=off and listens only on loopback), a stable
#   `service.instance.id`, and `otlp_http`, the exporter's name since 0.16x.
#
# Measured after the change: see ARCHITECTURE §5.2.

receivers:
  postgresql:
    endpoint: ${env:POSTGRESQL_ENDPOINT}
    username: ${env:POSTGRESQL_USERNAME}
    password: ${env:POSTGRESQL_PASSWORD}
    databases: [wera]
    collection_interval: 60s
    tls:
      insecure: true
    metrics:
      # Per table / per index: off (see the header).
      postgresql.blocks_read:
        enabled: false
      postgresql.operations:
        enabled: false
      postgresql.rows:
        enabled: false
      postgresql.table.size:
        enabled: false
      postgresql.table.vacuum.count:
        enabled: false
      postgresql.index.scans:
        enabled: false
      postgresql.index.size:
        enabled: false
      postgresql.sequential_scans:
        enabled: false
      # Per database, on top of the defaults (backends, commits, rollbacks, db_size, table.count).
      postgresql.database.locks:
        enabled: true
      postgresql.deadlocks:
        enabled: true
      postgresql.blks_hit:
        enabled: true
      postgresql.blks_read:
        enabled: true
      postgresql.temp_files:
        enabled: true
      postgresql.temp.io:
        enabled: true
      postgresql.wal.delay:
        enabled: true
      postgresql.bgwriter.maxwritten:
        enabled: true
      postgresql.bgwriter.buffers.allocated:
        enabled: true

processors:
  resource/postgresql:
    attributes:
      - key: service.name
        value: postgresql
        action: upsert
      - key: service.namespace
        value: infrastructure
        action: upsert
      - key: service.instance.id
        value: ${env:POSTGRESQL_INSTANCE_ID}
        action: upsert
  batch: {}

exporters:
  otlp_http/logfire:
    endpoint: ${env:LOGFIRE_INGEST_URL}
    headers:
      Authorization: Bearer ${env:LOGFIRE_TOKEN}

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics/postgresql:
      receivers: [postgresql]
      processors: [resource/postgresql, batch]
      exporters: [otlp_http/logfire]
