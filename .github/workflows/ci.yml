# CI runs on fixtures only: no job reads a repository secret (SPEC SEC-06), so pull
# requests from forks get exactly the same checks. Never switch this to pull_request_target.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WERA_DEMO_MODE: "true"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose --no-banner .

  web:
    name: Web (typecheck, unit tests, build, bundle scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No NEXT_PUBLIC_ secrets (SEC-03)
        run: pnpm check:public-env
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: No key-like strings in the client bundle (SEC-02, T-02)
        run: pnpm scan:bundle

  e2e:
    name: End-to-end journeys (demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
