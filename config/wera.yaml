# WERA behaviour (SPEC §9.2). Secrets never go here; they live in the repo root's .env.local,
# which is git-ignored and read by the agent at startup.

# Model id per tier (ARCHITECTURE §3.3). Pin dated ids; re-run the golden set before switching.
# A person can change these in Settings; everything below is file-only.
models:
  fast: qwen/qwen3.7-flash
  # Structured selection: cv.tailor returns bullet ids, not prose. A short, cheap, almost
  # deterministic call, so the cheapest capable model is the right one — and DeepSeek's measured
  # weakness was long structured prose, which this tier never asks for.
  select: deepseek/deepseek-v4.1-flash-1017
  scoring: qwen/qwen3.8-27b
  # Prose, and only prose. This was DeepSeek v4.1 Flash, which returned usable output on 63.6%
  # of 55 calls against this model's 97.6% on 41 — burning 409s on calls that produced nothing
  # (SPEC §14, 2026-10-25). Output is ~3.7x the price per token and a letter is ~2,500 tokens, so
  # a cover letter goes from about $0.0015 to $0.0055: noise against the $0.06–0.08 an
  # application costs in fit scoring, and it buys back the calls that produced nothing at all.
  writing: qwen/qwen3.8-27b

# Tried in order when the tier's model fails with a transport or server error. A different
# vendor first, so a provider outage doesn't take every attempt with it.
fallbacks:
  fast: [mistralai/mistral-small-3.2-24b-instruct, google/gemini-2.5-flash-lite]
  select: [qwen/qwen3.8-27b]
  scoring: [qwen/qwen3.7-flash]
  writing: [deepseek/deepseek-v4.1-flash-1017]

# USD per million tokens, used to price llm_calls rows and enforce the weekly budget (COST-01).
# Read from OpenRouter's /models on 2026-10-17 — re-check after changing a model id, because a
# wrong number here makes the budget wrong. An unlisted model is charged at `default`, which is
# deliberately high, so an unknown model is never free.
prices:
  default: { in: 3.0, out: 15.0 }
  qwen/qwen3.7-flash: { in: 0.03, out: 0.13 }
  qwen/qwen3.8-27b: { in: 0.24, out: 2.20 }
  qwen/qwen3.8-max-0902: { in: 2.00, out: 6.00 }
  deepseek/deepseek-v4.1-flash-1017: { in: 0.15, out: 0.60 }
  mistralai/mistral-small-3.2-24b-instruct: { in: 0.09, out: 0.25 }
  google/gemini-2.5-flash-lite: { in: 0.10, out: 0.40 }

# SPEC §9.3, one row per task. No task has tools.
tasks:
  profile.generate: { tier: fast, max_tokens: 800, reasoning: "off" }
  # Reading an uploaded CV into structure (CV-03). The writing tier, not the fast one: this is
  # the foundation every later search and every tailored line is built on, so a dropped role or
  # a mangled date is expensive in a way a cheaper model isn't worth.
  #
  # `reasoning: off`, like every other extraction task here. This had `low`, and it made the
  # task fail outright: extraction echoes most of the document back, so the answer is already
  # near the ceiling before a single thinking token, and at the time the truncation retry scaled
  # only the ceiling — so thinking that overflowed once overflowed again at double the room.
  # The retry scales both now, but the setting stands on its own merits: there is nothing here
  # to reason about, because which line is a date is read, not deduced.
  cv.parse: { tier: writing, max_tokens: 6000, reasoning: "off" }
  job.normalise: { tier: fast, max_tokens: 1200, reasoning: "off" }
  email.extract: { tier: fast, max_tokens: 1500, reasoning: "off" }
  # 900, up from 600: each term now carries a category, and up to 8 soft skills ride along in
  # their own bucket (`ExtractedKeyword`). 600 was sized for bare terms.
  keywords.extract: { tier: fast, max_tokens: 900, reasoning: "off" }
  # The job-description rubric, once per drafted pack (`nodes.analyse`). Short quotes and a few
  # labels; no thinking, because what it does is find sentences, not reason about them.
  job.analyse: { tier: fast, max_tokens: 900, reasoning: "off" }
  # The CV rubric's judgement half, once per CV version (`Store.cv_profile`).
  cv.profile: { tier: fast, max_tokens: 900, reasoning: "off" }
  # The Strategist (`nodes.strategist`): which boards serve each target country for this field,
  # and the titles as local postings write them. Scoring tier with a little thinking, because
  # knowing that a German posting says "Softwareentwickler (m/w/d)" is recall, but choosing a
  # board for a trainee solicitor over a graduate board is judgement. Once per CV × profile.
  strategist.plan: { tier: scoring, max_tokens: 2400, reasoning: low }
  # Measured on qwen3.8-27b against real 6–10k-char postings: a reply takes 1,200–1,500 tokens
  # including its thinking, but how long it thinks swings call to call, and 1,200 + headroom cut
  # off seven of eight jobs. 2,400 clears the observed range, and a cut-off reply retries once
  # with double the room (gateway.TRUNCATION_RETRY_FACTOR). Only generated tokens are billed.
  fit.score: { tier: scoring, max_tokens: 2400, reasoning: low }
  # The select tier, and 700 tokens rather than 4,500 — because the reply is now a list of ids.
  #
  # This was `{ tier: writing, max_tokens: 4500, reasoning: "on" }`, and it was the single
  # most expensive and least reliable call in the product: the old `TailorOutput` made the model
  # retype every bullet, so the reply was most of a CV, it still overran 7,500 tokens on
  # `wera eval --packs`, and any wording that came back altered was then rejected by the citation
  # guard — one `guard.repair` call per failing line, and a different CV every run.
  #
  # `reasoning: off`, like the other tasks that select rather than compose: which bullet answers
  # a requirement is read off the page, and the model has no text to plan.
  cv.tailor: { tier: select, max_tokens: 700, reasoning: "off" }
  # TAIL-07: the professional profile, composed from cited CV lines — and only for a CV that has
  # no summary of its own to select, so this fires rarely rather than once per pack.
  #
  # The writing tier, for two sentences. It is the first thing a recruiter reads and the one line
  # on the page a model actually composes, so it is the wrong place to save $0.002.
  #
  # `reasoning: off`, and measured rather than assumed: this shipped as `low` on the argument that
  # choosing which of a dozen bullets belongs in a 50-word profile is a judgement. It is, but not
  # one this tier needs thinking tokens for — `wera eval --packs` cut the call off at 2,100 (900
  # plus the `low` allowance) while producing a 60-word answer, which is the same pathology
  # `guard.repair` above was measured into: given room to deliberate over a short rewrite, this
  # model spends it, and the answer is what gets truncated. Off, 900 tokens is roughly fifteen
  # times the reply.
  summary.write: { tier: writing, max_tokens: 900, reasoning: "off" }
  # `off`. This was `on`, and it was the most expensive call in a pack: measured 2026-11-10 on
  # qwen3.8-27b, about half of first attempts thought until stopped (5,500, then 11,000 tokens),
  # on any host and whatever the effort or budget, at $0.01–0.025 a letter and 60–100 seconds.
  # Without thinking the same letter came back first time every time, in ~600 tokens and a few
  # seconds. What thinking was buying — planning the paragraphs — the template and the keyword
  # plan (`nodes.letter_plan`) now provide, and what it was guarding against — a claim the CV
  # doesn't carry — the claim check (`guard.claims`) catches. A cut-off `on` task still retries
  # without thinking (gateway `cut_off`), should this go back to `on`.
  letter.write: { tier: writing, max_tokens: 1500, reasoning: "off" }
  # `reasoning: off`, and the measurement that forced it: this task was given an average of 429
  # input tokens — one line, its source lines, and what failed — and emitted an average of **972
  # output tokens over 16.8 seconds** to rewrite a single sentence. The sentence is forty tokens.
  # The rest was deliberation about a task that needs none: the instruction is "remove or soften
  # what the cited lines don't carry, or return null", which is a rewrite, not a judgement.
  #
  # It runs three to five times per cover letter, serially, so it was most of the letter's wall
  # clock — more than `letter.write` itself. The ceiling drops with it: a repaired line is one
  # line, and 2,500 tokens was a budget for thinking rather than for the answer.
  guard.repair: { tier: writing, max_tokens: 600, reasoning: "off" }
  # `low`, not `on`. Measured at 1,266 output tokens for two or three short answers, which is
  # several times the answers themselves. Some judgement is wanted here — deciding an answer is
  # not in the CV and returning null is the whole point (ANS-02/03) — so this keeps a thinking
  # allowance, just not the largest one.
  answers.draft: { tier: writing, max_tokens: 1500, reasoning: low }
  # The claim check (`nodes.guard.claim_violations`): one call per letter, listing what a
  # paragraph says about the applicant that its cited lines don't. Scoring tier, not fast: this
  # is a judgement about meaning, and a false positive costs a paragraph a repair call.
  guard.claims: { tier: scoring, max_tokens: 600, reasoning: "off" }

# §8.2 fit weights. Normalised in code, so they needn't sum to 1.
weights:
  core: 0.35
  adjacent: 0.20
  experience: 0.20
  eligibility: 0.15
  freshness: 0.10

# SRCH-06: what one intake run may spend before it stops as partial. Credits are Firecrawl's
# own unit, counted at its published rates: 2 per search, 5 per JSON-format page scrape.
#
# 150 is sized for one run a day on Firecrawl's Hobby plan (5,000 credits a month, about 160 a
# day): 20 queries costs 40, which leaves 22 new pages. `max_pages: 30` would need 150 credits
# on its own, so on a heavy first run the credit cap is what stops it — which is the right way
# round, because credits are what the invoice is in. Raise this with the plan, not with hope.
# `max_pages` now bounds *paid* page reads only. SRCH-05 reads pages locally first — JSON-LD, the
# ATS feeds, then the fast tier (`sources/extract.py`) — and only a page no free rung could read
# reaches Firecrawl. So the cap stopped being "how many pages a run may read", which was what made
# it the thing that ended a run early, and became "how many a run may pay for". Lowered to match:
# if a run is paying for more than ten pages, something has changed about a board and the right
# response is to notice, not to keep buying. Watch `fallbackPages` on the run row.
max_queries: 20
max_pages: 10
max_credits_per_run: 150
# Over any seven days, every run counted — what bounds a *schedule*, which the per-run cap can't:
# four scheduled runs a day at 150 would be 4,200 a week. 600 is four full runs, and a run that
# reaches it stops paying (ends `partial`) while the free paths — the Harvester included — go on.
max_credits_per_week: 600
# SRCH-20: Serper queries one search may send, across every tier (one Serper credit each). Tier 1
# is the top three titles as an open search and against each reviewed board — about 15 queries on
# a four-board profile — and later tiers are only sent when a search is short of 8 jobs.
max_serper_queries: 30

# SRCH-10: a short-term cache in front of Firecrawl, so a run doesn't pay for the last one's
# answers again. `known_urls` (SRCH-05) already stops a job being re-scraped; this covers the two
# things it can't — the searches themselves, which are paid for before their results are
# filtered, and the pages that were scraped and *didn't* turn into a job. The second of those was
# a permanent leak: a page WERA can't read a title off never becomes a job, so it never enters
# `known_urls`, and it was re-scraped at 5 credits on every run for ever.
#
# The caps above are per run and the cache doesn't touch them: a cached answer costs no credits,
# so it isn't counted against a budget that exists to bound the invoice. What it changes is how
# far 150 credits gets — a run that would have spent 40 on searches it already had now spends
# them on 8 more pages instead. It also means a credit-capped run makes progress: the queries it
# already paid for come back free next time, so the budget goes to the ones it never reached.
#
# The two windows are different on purpose. A stale *search* hides jobs that exist, so it is
# short. A stale *card* can only describe a job that has closed — never corrupt a live one, since
# a URL that became a job is filtered out before the cache is consulted — so it is longer, and it
# is the half that costs 5 credits rather than 2.
#
# Set `enabled: false` for a cold run. Expired entries are dropped at the start of every run.
crawl_cache:
  enabled: true
  search_minutes: 360 # 6h
  card_minutes: 2880 # 48h
  unreadable_minutes: 2880 # 48h
  max_entries: 500
  max_payload_bytes: 200000

# ATS-05: how many searches one board-discovery pass may run, one per watch title. Its own
# budget rather than a share of the run's, because discovery happens weekly and the daily cap
# above is sized for a daily run — taking it out of there would mean the week's discovery
# quietly ate a morning's board search. 8 searches is 16 credits, about a tenth of a run.
discovery_max_queries: 8

# MATCH-05: how many jobs a day reach the scoring tier. The day's ceiling, across every run and
# every "score more" — batching below changes *when* a job is paid for, never how many are.
max_scored_per_day: 40

# SRCH-26: how many jobs one search surfaces. It stops reading postings once `max` are scored,
# and below `min` it goes on to the Strategist's next tier of queries until it gets there or a cap
# stops it. The postings it found and didn't read wait in the queue for "Find more", so the
# twelfth job isn't paid for until someone has read the eleventh. Inbox and watchlist runs score
# up to `max` of what they found, the same ceiling.
surface:
  min: 8
  max: 12

# LTR-04: phrases that make a cover letter read like a form. A hit triggers one rewrite, and the
# phrase is quoted back so the model knows which words to lose rather than guessing at "be less
# formal". Matched case-insensitively as substrings, so "I am writing to express" catches its
# longer forms too.
#
# These are the register, not the content. A letter can be perfectly honest and perfectly cited
# and still read like a committee wrote it, which is the one thing a cover letter cannot afford.
letter_banned_phrases:
  - I am writing to express
  - I am writing to apply
  # Measured in live letters written without thinking (2026-11-10).
  - I am writing to you
  - I am applying for
  - my thesis
  - I would like to express my interest
  - I am passionate about
  - I am excited about the opportunity
  - perfect fit
  - ideal candidate
  - wealth of experience
  - proven track record
  - results-driven
  - team player
  - think outside the box
  - hit the ground running
  - dynamic environment
  - leverage my skills
  - in today's fast-paced
  - it is with great
  - I believe I would be
  - thank you for considering my application
  - look forward to hearing from you at your earliest convenience

# SRCH-13 / ATS-06 / NORM-07: the daily lifecycle sweep, which asks whether the jobs WERA already
# found still exist. It spends **no Firecrawl credits** — employers' own public feeds and plain
# HTTP only — so these caps are about not hammering a board at 07:00, not about money.
#
# A job is closed only on positive evidence: a 404/410, a redirect that has lost the job's
# identity, or absence from a feed that answered. A board that blocks a bot, times out or
# rate-limits leaves the job flagged and still ranked, because inconclusive is not withdrawal.
lifecycle:
  max_boards_per_sweep: 40 # employers, not jobs: one fetch covers every job on a board
  max_http_checks: 150
  archive_after_days: 30 # NORM-07, measured on max(lastSeen, lastConfirmedAt)

# ATSC-03's target coverage. `nodes/ats.py:reconcile_skills` adds master-CV-backed keywords to
# the skills line until coverage clears this, then stops — a line carrying every term the post
# mentioned passes the robot and reads as keyword spam to the person who sees it next.
ats_threshold: 0.75
weekly_budget_usd: 5
cv_pages: 1

# Saving a CV clears every job, score, application and pack built from the old one, so the next
# search starts from nothing (`Store.reset_job_world`).
#
# **On because WERA has one user and that user is testing it.** The loop this serves is: upload a
# CV, run a search, judge the shortlist, read the generated CV and letter, then do it again with
# a different CV. Each pass has to be independent, and without this it isn't — a pack cites
# master-CV bullet ids, and ids are derived from employer names (`domain/cv_build`), so a pack
# written against a different person's CV doesn't merely show stale scores, it cites lines that
# no longer exist. The crawl cache goes too, or the "fresh search" replays the last one's results
# from cache and the search is the one thing not being tested.
#
# **Turn this off before accounts exist.** Then a new CV means CV-08's re-score — the behaviour
# `put_cv` still has when this is false — because a real user editing their CV must not lose the
# applications they have already sent. What stays either way is the money and the person: the
# `llm_calls` ledger behind the weekly budget (COST-01), the CV itself, the contact details, the
# search profile and the settings.
reset_on_cv_upload: true

# SRCH-27: a "Clear jobs" control in Settings (and `wera jobs clear`) that deletes every job,
# application and pack so the next search starts from an empty screen. Kept: the CV, the profile,
# the settings, and both ledgers (model spend and Firecrawl credits), so clearing never hands back
# budget. **Testing only — turn this off before accounts exist**, as with `reset_on_cv_upload`.
allow_clear_jobs: true

# How much of a posting the prompts that write may see (see config.py for why).
job_description_limit: 6000

# One model call: how long to wait, and how many times to retry a transport error before
# falling back. Schema failures are retried once by the gateway, not here.
#
# 180, not 60. Measured on `wera eval --packs`, a writing-tier call takes 39–125s — so a 60s
# timeout cut off most of them *mid-generation*, and each cut-off call then burnt its SDK
# retries and its fallback model before anything gave up. The timeout was manufacturing the
# failures it existed to bound.
#
# Retries drop to 1 for the same reason: the fallback chain already covers a provider that can't
# answer, so a second SDK retry only multiplies the wait on a model that won't.
#
# Raising a per-call timeout makes the *worst* case worse, so it is paired with
# `gateway.TASK_DEADLINE_SECONDS`, which bounds one logical task across every attempt. That is
# the number that stops a hang; this one just stops a healthy call being killed.
llm_timeout_seconds: 180
llm_max_retries: 1
